stages:
  - build
  - test

variables:
  TEST_IMAGE: $CI_REGISTRY_IMAGE:latest
  ENV: "stage"

build_test_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $TEST_IMAGE -f docker/test-runner/Dockerfile .
    - docker push $TEST_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

.test_template:
  stage: test
  image: $TEST_IMAGE
  artifacts:
    when: always
    paths:
      - allure-results-api
      - allure-results-selenium
      - allure-results-playwright
    expire_in: 1 week

api_tests:
  extends: .test_template
  variables:
    MARKERS: "api"
  script:
    - bash docker/test-runner/entrypoint.sh --alluredir=allure-results-api

selenium_tests:
  extends: .test_template
  services:
    - name: selenium/standalone-chrome:latest
      alias: selenium
  variables:
    MARKERS: "selenium"
    SELENIUM_URL: "http://selenium:4444/wd/hub"
  script:
    - pytest -m "$MARKERS" --alluredir=allure-results-selenium -p no:cacheprovider

playwright_tests:
  extends: .test_template
  variables:
    MARKERS: "playwright"
  script:
    - pytest -m "$MARKERS" --alluredir=allure-results-playwright -p no:cacheprovider