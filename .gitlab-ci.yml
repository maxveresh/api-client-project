image: mcr.microsoft.com/playwright/python:v1.48.0-noble

stages:
  - test

run_tests:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - playwright install chromium --with-deps
  script:
    - pytest --alluredir=allure-results
  artifacts:
    when: always
    paths:
      - allure-results
    expire_in: 1 week