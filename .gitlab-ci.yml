stages:
  - build
  - test

variables:
  TEST_IMAGE: $CI_REGISTRY_IMAGE:latest
  ENV: "stage"

build_test_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY_SERVER
  script:
    - docker build -t $TEST_IMAGE -f docker/test-runner/Dockerfile .
    - docker push $TEST_IMAGE
  rules:
    - changes:
      - docker/test-runner/Dockerfile
      - requirements.txt

.test_template:
  stage: test
  image: $TEST_IMAGE
  artifacts:
    when: always
    paths:
      - allure-results-api
      - allure-results-selenium
      - allure-results-playwright
    expire_in: 1 week

api_tests:
  extends: .test_template
  script:
    - export MARKERS="api"
    - bash docker/test-runner/entrypoint.sh --alluredir=allure-results-api

selenium_tests:
  extends: .test_template
  services:
    - name: selenium/standalone-chrome:latest
      alias: selenium
  variables:
    SELENIUM_URL: "http://selenium:4444/wd/hub"
  script:
    - export MARKERS="selenium"
    - pytest -m "$MARKERS" --alluredir=allure-results-selenium -p no:cacheprovider

playwright_tests:
  extends: .test_template
  script:
    - export MARKERS="playwright"
    - pytest -m "$MARKERS" --alluredir=allure-results-playwright -p no:cacheprovider
